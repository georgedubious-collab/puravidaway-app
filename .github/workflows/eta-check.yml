# Every 5 minutes: ask the site to check whether drivers will reach their pickups on time
# (live traffic) and alert the team if one would be more than 20 minutes late, or isn't
# sharing location close to the pickup. See src/lib/eta.ts.
# Once an hour (second schedule below): send the single "please rate your driver" reminder
# to travellers whose trip ended 24+ hours ago. See src/lib/reviewReminder.ts. The same hourly
# job sends the day-before reminders (traveller + driver) and the "book your return" email the
# morning after a ride. See src/lib/automationRules.ts.
# Needs the repository secret CRON_SECRET (same value as in Vercel). GitHub's schedule can
# run a few minutes late; the driver app also triggers the same check while it's reporting.
name: Driver ETA check

on:
  schedule:
    - cron: "*/5 * * * *"
    # Hourly, off the 5-minute marks. Keep this text the same as in the `reviews` job below.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    # Not on the hourly schedule: that one is only for the rating reminders.
    if: github.event.schedule != '7 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: eta-check
      cancel-in-progress: true
    steps:
      - name: Check upcoming pickups
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.costaricaprivatetransfers.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is not set in GitHub, so the ETA check did not run."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/eta"
      # Same schedule: email travellers without the app about trip-chat messages unread
      # for 10+ minutes, one email per unread batch (src/lib/chatEmails.ts).
      - name: Email unread trip-chat messages
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.costaricaprivatetransfers.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then exit 0; fi
          curl --fail-with-body -sS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/chat-unread"

  # Once an hour (and when the workflow is started by hand): the one rating reminder, 24 hours
  # after the trip ended, by push and email. The site decides who is due, sends each reminder
  # only once and sends nothing between 9 PM and 7 AM Costa Rica time, so calling it more
  # often changes nothing. Vercel Cron also calls it once a day as a backstop (vercel.json).
  reviews:
    if: github.event.schedule == '7 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: review-reminders
      cancel-in-progress: false
    steps:
      - name: Send rating reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.costaricaprivatetransfers.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is not set in GitHub, so the rating reminders did not run."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/review-reminders"
      # The day-before reminder: one to the traveller and one to the driver when a confirmed
      # pickup is 20–28 hours away, never 9 PM–7 AM Costa Rica time (src/lib/dayBeforeReminders.ts).
      # Also re-sends any low-rating alert to the team that didn't go out when the rating was saved.
      - name: Send day-before reminders
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.costaricaprivatetransfers.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then exit 0; fi
          curl --fail-with-body -sS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/trip-reminders"
      # The "book your return / a day tour" email, the morning after a completed ride, with an
      # unsubscribe link (src/lib/tripFollowup.ts).
      - name: Send return-ride suggestions
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.costaricaprivatetransfers.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then exit 0; fi
          curl --fail-with-body -sS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/trip-followups"
